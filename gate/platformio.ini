; racetimer gate controller (ESP32-WROOM). GPL-3.0-or-later.
;
; Same pioarduino platform (ESP-IDF 5.5.5) as Widscan58, so one toolchain
; builds both boards.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32dev
monitor_speed = 115200

[env:native]
; Host unit tests for the target-independent fusion code.
platform = native
build_flags = -std=gnu11
test_build_src = no
